##################################################################
# Package: Raccolta Differenziata                                #
# Autore: Simonz82, con basi di Saverio Gravagnola e Agostino    #
#         Pitasi                                                 #
# Spunti: http://domoticamente.it e                               #
#         https://github.com/scheccia1/hagarbage                 #
#                                                                  #
# DIPENDENZA: questo package chiama script.notifica_vocale_alexa,#
# che si trova nell'ALTRO file di questo repo,                    #
# packages/centro_notifiche_alexa.yaml — copia anche quello,      #
# altrimenti l'annuncio vocale su Alexa non funziona (il push e   #
# il resto della card funzionano comunque).                       #
# Compatibile HA 2025-2026                                        #
##################################################################

homeassistant:
  customize:
    # Sezione usata solo per definire ANCHORS YAML (trucco "package.node_anchors")
    package.node_anchors:
      customize: &customize
        package: "Raccolta Differenziata"
        author: "Simonz82, Saverio Gravagnola, Agostino Pitasi"
        reference: "WebSite: www.domoticamente.it, https://github.com/Simonz82/ha_garbage, https://github.com/scheccia1/hagarbage"

      #########################################################
      # IMPOSTAZIONI DA MODIFICARE CON LE TUE ENTITÀ           #
      #########################################################
      setting:
        # Sostituisci con i TUOI dispositivi per la notifica push (companion app)
        Device per notifica push 1: &push1 mobile_app_pippo # es. il tuo smartphone
        Device per notifica push 2: &push2 entita_smartphone_2 # un secondo telefono, opzionale

        # Etichette dei rifiuti - NON serve modificarle, sono solo i testi mostrati
        Rifiuto 1: &rifiuto1 "♻ Indifferenziato"
        Rifiuto 2: &rifiuto2 "🍌 Organico"
        Rifiuto 3: &rifiuto3 "🔪 Organico e Resto"
        Rifiuto 4: &rifiuto4 "🥡 Carta"
        Rifiuto 5: &rifiuto5 "🍶 Vetro"
        Rifiuto 6: &rifiuto6 "🥛 Plastica"
        Rifiuto 7: &rifiuto7 "🤷‍Nulla"

########################################################################################################################
#                                                     ATTENZIONE!                                                      #
#                  NON MODIFICARE AL DI SOTTO DI QUESTE RIGHE SE NON SI È SICURI DI QUELLO CHE SI FA.                  #
#                 I PARAMETRI DA CONFIGURARE PER IL CORRETTO FUNZIONAMENTO SONO SOLO QUELLI QUI SOPRA.                 #
########################################################################################################################

###########
# BOOLEAN #
###########
input_boolean:
  raccolta_differenziata_da_notificare:
    name: Raccolta differenziata da notificare
    icon: mdi:bell

##########
# NUMBER #
##########
# Volume/ritardo dell'annuncio Alexa NON sono qui: arrivano dagli helper
# condivisi di centro_notifiche_alexa.yaml (vedi sopra). Qui resta solo la
# frequenza del promemoria, che è specifica di questa card.
input_number:
  frequenza_notifiche_raccolta_differenziata:
    name: Frequenza notifiche raccolta differenziata
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-sync
    initial: 15

############
# DATETIME #
############
input_datetime:
  raccolta_differenziata_notifiche_start_time:
    name: Inizio notifiche raccolta differenziata
    has_time: true
    has_date: false
    icon: mdi:timer-music
    initial: "06:00:00"

  raccolta_differenziata_notifiche_end_time:
    name: Fine notifiche raccolta differenziata
    has_time: true
    has_date: false
    icon: mdi:timer-off
    initial: "23:00:00"

########
# TEXT #
########
# L'elenco dei tipi di raccolta del tuo comune lo scrivi tu (dal pulsante "Tipi di raccolta"
# sulla card): nomi separati da virgola, per esempio  Carta, Vetro, Plastica, Organico, Indifferenziato
# ("Nulla" = nessun ritiro viene aggiunto da solo). Se e' vuoto si usa l'elenco di esempio qui sotto.
# NON mettere "initial": un initial cancellerebbe la tua scelta a ogni riavvio.
input_text:
  raccolta_tipi_elenco:
    name: Tipi di raccolta del comune
    icon: mdi:format-list-bulleted
    max: 255

  # Copia "al sicuro" della scelta di ogni giorno: un input_select con opzioni cambiate da
  # automazione perde la scelta al riavvio, il testo invece sopravvive e la riscrive.
  raccolta_giorno_lun: {name: Scelta raccolta lun, max: 100}
  raccolta_giorno_mar: {name: Scelta raccolta mar, max: 100}
  raccolta_giorno_mer: {name: Scelta raccolta mer, max: 100}
  raccolta_giorno_gio: {name: Scelta raccolta gio, max: 100}
  raccolta_giorno_ven: {name: Scelta raccolta ven, max: 100}
  raccolta_giorno_sab: {name: Scelta raccolta sab, max: 100}
  raccolta_giorno_dom: {name: Scelta raccolta dom, max: 100}

##########
# SELECT #
##########
input_select:
  # Layout della card: classico (immagine a sinistra) oppure centrato (immagine grande in alto).
  layout_garbage:
    name: Layout Raccolta Differenziata
    icon: mdi:view-dashboard-outline
    options:
      - Classico
      - Centrato

  # I giorni sono volutamente "sfasati" di uno: raccolta_differenziata_lun
  # indica il rifiuto ritirato MARTEDÌ (il giorno dopo), perché la card lo
  # usa per dire "stanotte esci il bidone per il ritiro di domani".
  raccolta_differenziata_lun:
    name: Rifiuto raccolto Martedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_mar:
    name: Rifiuto raccolto Mercoledì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_mer:
    name: Rifiuto raccolto Giovedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_gio:
    name: Rifiuto raccolto Venerdì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_ven:
    name: Rifiuto raccolto Sabato
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_sab:
    name: Rifiuto raccolto Domenica
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_dom:
    name: Rifiuto raccolto Lunedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]

################################
# TEMPLATE SENSORI             #
################################
template:
  - sensor:
      # 1) Giorno della settimana -> sensor.giorno_della_settimana (es. "lun")
      - name: Giorno della settimana
        state: >
          {{ ['lun','mar','mer','gio','ven','sab','dom'][now().weekday()] }}
        icon: >
          mdi:{{ ['emoticon-dead-outline','emoticon-angry-outline','emoticon-sad-outline','emoticon-neutral-outline','emoticon-cool-outline','emoticon-excited-outline','emoticon-happy-outline'][now().weekday()] }}

      # 2) RaccoltaDifferenziata -> sensor.raccoltadifferenziata (il rifiuto di OGGI, usato dalla card)
      # Stato = nome del rifiuto senza emoji. La scelta vera e' quella salvata in
      # input_text.raccolta_giorno_* (sopravvive al riavvio), con il menu come ripiego.
      - name: RaccoltaDifferenziata
        state: >-
          {% set wd = states('sensor.giorno_della_settimana') %}
          {% set t = states('input_text.raccolta_giorno_' ~ wd) %}
          {% set raw = t if t not in ['', 'unknown', 'unavailable'] else states('input_select.raccolta_differenziata_' ~ wd) %}
          {{ raw | regex_replace('^[\\W_]+', '') }}
        attributes:
          completo: >-
            {% set wd = states('sensor.giorno_della_settimana') %}
            {% set t = states('input_text.raccolta_giorno_' ~ wd) %}
            {{ t if t not in ['', 'unknown', 'unavailable'] else states('input_select.raccolta_differenziata_' ~ wd) }}
          emoji: >-
            {% set wd = states('sensor.giorno_della_settimana') %}
            {% set t = states('input_text.raccolta_giorno_' ~ wd) %}
            {% set raw = t if t not in ['', 'unknown', 'unavailable'] else states('input_select.raccolta_differenziata_' ~ wd) %}
            {{ raw | replace(raw | regex_replace('^[\\W_]+', ''), '') | trim }}

      # 3) GiornoSettimana -> sensor.giornosettimana (es. "Lunedì", usato dalla card)
      - name: GiornoSettimana
        state: >-
          {% set gg = now().weekday() %}
          {% set nomi = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'] %}
          {{ nomi[gg] }}

      # 4) GiornoRitiro -> sensor.giornoritiro (il giorno di DOMANI, usato dalla card)
      - name: GiornoRitiro
        state: >-
          {% set gg = now().weekday() %}
          {% set nomi = ['Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica','Lunedì'] %}
          {{ nomi[gg] }}

####################
# NOTIFICHE GRUPPO #
####################
notify:
  - name: Raccolta Differenziata Gruppo Notifiche App
    platform: group
    services:
      - service: *push1
      - service: *push2

###############
# AUTOMAZIONI #
###############
automation:
  # Attiva il flag "da notificare" all'orario di inizio finestra
  - alias: Attiva da notificare raccolta differenziata
    id: attiva_da_notificare_raccolta_differenziata
    mode: single
    trigger:
      - platform: time
        at: "04:59:00"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.raccolta_differenziata_da_notificare

  # Disattiva il flag all'orario di fine finestra
  - alias: Disattiva da notificare raccolta differenziata
    id: disattiva_da_notificare_raccolta_differenziata
    mode: single
    trigger:
      - platform: time
        at: input_datetime.raccolta_differenziata_notifiche_end_time
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.raccolta_differenziata_da_notificare

  # Promemoria ricorrente (push + vocale) mentre il flag è attivo, nella
  # finestra oraria, e solo se oggi c'è davvero qualcosa da buttare.
  # Un solo canale push (gruppo -> i tuoi telefoni) + un solo annuncio
  # vocale: niente doppio invio per lo stesso promemoria.
  - alias: Ricorda raccolta differenziata
    id: ricorda_raccolta_differenziata
    mode: single

    trigger:
      - platform: template
        value_template: >
          {{ (now().minute % (states('input_number.frequenza_notifiche_raccolta_differenziata') | int(15))) == 0 }}

    condition:
      - condition: state
        entity_id: input_boolean.raccolta_differenziata_da_notificare
        state: "on"
      - condition: time
        after: input_datetime.raccolta_differenziata_notifiche_start_time
        before: input_datetime.raccolta_differenziata_notifiche_end_time
      - condition: template
        value_template: >
          {{ states('sensor.raccoltadifferenziata') != 'Nulla' }}

    action:
      - service: notify.raccolta_differenziata_gruppo_notifiche_app
        continue_on_error: true
        data:
          title: "🚮 Ricordati di buttare l'immondizia"
          message: >-
            {{ state_attr('sensor.raccoltadifferenziata', 'completo') }}

      # Annuncio vocale su Alexa - usa il dispositivo/volumi/ritardo di
      # default dello script condiviso (packages/centro_notifiche_alexa.yaml).
      - service: script.notifica_vocale_alexa
        data:
          messaggio: >-
            Ricordati di buttare l'immondizia. Oggi si butta {{ states('sensor.raccoltadifferenziata') }}.

  # Annuncio vocale di TEST: crea da UI un helper booleano chiamato
  # input_boolean.test_notifica (Impostazioni > Dispositivi e servizi >
  # Helper > Interruttore) per poter provare l'annuncio a comando, senza
  # aspettare il ciclo automatico del promemoria.
  - alias: Test notifica vocale raccolta differenziata
    id: test_notifica_vocale_raccolta_differenziata
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.test_notifica
        to: "on"
    action:
      - service: script.notifica_vocale_alexa
        data:
          messaggio: >-
            Ricordati di buttare l'immondizia. Oggi si butta {{ states('sensor.raccoltadifferenziata') }}.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.test_notifica

  # ---- Tipi di raccolta scritti a mano ----------------------------------------------
  # Ricostruisce i 7 menu dei giorni partendo dall'elenco scritto in input_text.raccolta_tipi_elenco.
  # A ogni nome aggiunge da solo un'emoji (carta, vetro, plastica, organico...; se non la conosce
  # mette un cestino) e in fondo "Nulla". La scelta gia' fatta per ogni giorno viene mantenuta.
  - alias: "Raccolta differenziata: aggiorna elenco tipi"
    id: raccolta_differenziata_aggiorna_tipi
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_text.raccolta_tipi_elenco
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: raccolta_tipi_aggiorna
    actions:
      # All'avvio si aspetta che gli helper siano pronti.
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - delay: "00:00:30"
      - variables:
          tipi: >-
            {% set grezzo = states('input_text.raccolta_tipi_elenco') %}
            {% set grezzo = grezzo if grezzo not in ['', 'unknown', 'unavailable'] else 'Indifferenziato, Organico, Organico e Resto, Carta, Vetro, Plastica' %}
            {% set mappa = {'indifferenziato': '♻', 'secco': '♻', 'residuo': '♻', 'organico e resto': '🔪', 'organico': '🍌', 'umido': '🍌', 'carta': '🥡', 'cartone': '🥡', 'vetro': '🍶', 'plastica': '🥛', 'lattine': '🥫', 'metalli': '🥫', 'verde': '🌿', 'sfalci': '🌿', 'ingombranti': '🛋', 'pile': '🔋', 'farmaci': '💊', 'tessili': '👕', 'oli': '🛢'} %}
            {% set ns = namespace(out=[]) %}
            {% for t in (grezzo | replace(';', ',') | replace('\n', ',') | replace('|', ',')).split(',') %}
              {% set t = t | trim %}
              {% if t != '' and (t | regex_replace('^[\\W_]+', '') | lower) != 'nulla' %}
                {% if t[0] | regex_match('[A-Za-zÀ-ÿ0-9]') %}
                  {% set low = t | lower %}
                  {% set e = namespace(v='🗑', n=0) %}
                  {% for k, v in mappa.items() %}
                    {% if k in low and k | length > e.n %}{% set e.v = v %}{% set e.n = k | length %}{% endif %}
                  {% endfor %}
                  {% set voce = e.v ~ ' ' ~ (t[0] | upper) ~ t[1:] %}
                {% else %}
                  {% set voce = t %}
                {% endif %}
                {% if voce not in ns.out %}{% set ns.out = ns.out + [voce] %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.out + ['🤷 Nulla'] }}
      - repeat:
          for_each: [lun, mar, mer, gio, ven, sab, dom]
          sequence:
            - variables:
                salvato: "{{ states('input_text.raccolta_giorno_' ~ repeat.item) }}"
                corrente: "{{ states('input_select.raccolta_differenziata_' ~ repeat.item) }}"
                voleva: >-
                  {{ salvato if salvato not in ['', 'unknown', 'unavailable'] else corrente }}
                nome: "{{ voleva | regex_replace('^[\\W_]+', '') | lower }}"
                scelta: >-
                  {% set ns = namespace(v=tipi[-1]) %}
                  {% for o in tipi %}
                    {% if (o | regex_replace('^[\\W_]+', '') | lower) == nome %}{% set ns.v = o %}{% endif %}
                  {% endfor %}
                  {{ ns.v }}
            - action: input_select.set_options
              target:
                entity_id: "input_select.raccolta_differenziata_{{ repeat.item }}"
              data:
                options: "{{ tipi }}"
            - action: input_select.select_option
              target:
                entity_id: "input_select.raccolta_differenziata_{{ repeat.item }}"
              data:
                option: "{{ scelta }}"
            - action: input_text.set_value
              target:
                entity_id: "input_text.raccolta_giorno_{{ repeat.item }}"
              data:
                value: "{{ scelta }}"

  # Quando scegli tu un tipo dal menu di un giorno, lo salva (le modifiche fatte dall'automazione
  # qui sopra non hanno un utente e vengono ignorate).
  - alias: "Raccolta differenziata: salva scelta giorno"
    id: raccolta_differenziata_salva_scelta_giorno
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_select.raccolta_differenziata_lun
          - input_select.raccolta_differenziata_mar
          - input_select.raccolta_differenziata_mer
          - input_select.raccolta_differenziata_gio
          - input_select.raccolta_differenziata_ven
          - input_select.raccolta_differenziata_sab
          - input_select.raccolta_differenziata_dom
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id is not none
             and trigger.from_state is not none
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: "input_text.raccolta_giorno_{{ trigger.entity_id.split('_')[-1] }}"
        data:
          value: "{{ trigger.to_state.state }}"
