##################################################################
# Package: Raccolta Differenziata                                #
# Autore: Simonz82, con basi di Saverio Gravagnola e Agostino    #
#         Pitasi                                                 #
# Spunti: http://domoticamente.it e                               #
#         https://github.com/scheccia1/hagarbage                 #
#                                                                  #
# DIPENDENZA: questo package chiama script.notifica_vocale_alexa,#
# che si trova nell'ALTRO file di questo repo,                    #
# packages/centro_notifiche_alexa.yaml — copia anche quello,      #
# altrimenti l'annuncio vocale su Alexa non funziona (il push e   #
# il resto della card funzionano comunque).                       #
# Compatibile HA 2025-2026                                        #
##################################################################

homeassistant:
  customize:
    # Sezione usata solo per definire ANCHORS YAML (trucco "package.node_anchors")
    package.node_anchors:
      customize: &customize
        package: "Raccolta Differenziata"
        author: "Simonz82, Saverio Gravagnola, Agostino Pitasi"
        reference: "WebSite: www.domoticamente.it, https://github.com/Simonz82/ha_garbage, https://github.com/scheccia1/hagarbage"

      #########################################################
      # IMPOSTAZIONI DA MODIFICARE CON LE TUE ENTITÀ           #
      #########################################################
      setting:
        # Sostituisci con i TUOI dispositivi per la notifica push (companion app)
        Device per notifica push 1: &push1 mobile_app_pippo # es. il tuo smartphone
        Device per notifica push 2: &push2 entita_smartphone_2 # un secondo telefono, opzionale

        # Etichette dei rifiuti - NON serve modificarle, sono solo i testi mostrati
        Rifiuto 1: &rifiuto1 "♻ Indifferenziato"
        Rifiuto 2: &rifiuto2 "🍌 Organico"
        Rifiuto 3: &rifiuto3 "🔪 Organico e Resto"
        Rifiuto 4: &rifiuto4 "🥡 Carta"
        Rifiuto 5: &rifiuto5 "🍶 Vetro"
        Rifiuto 6: &rifiuto6 "🥛 Plastica"
        Rifiuto 7: &rifiuto7 "🤷‍Nulla"

########################################################################################################################
#                                                     ATTENZIONE!                                                      #
#                  NON MODIFICARE AL DI SOTTO DI QUESTE RIGHE SE NON SI È SICURI DI QUELLO CHE SI FA.                  #
#                 I PARAMETRI DA CONFIGURARE PER IL CORRETTO FUNZIONAMENTO SONO SOLO QUELLI QUI SOPRA.                 #
########################################################################################################################

###########
# BOOLEAN #
###########
input_boolean:
  raccolta_differenziata_da_notificare:
    name: Raccolta differenziata da notificare
    icon: mdi:bell

##########
# NUMBER #
##########
# Volume/ritardo dell'annuncio Alexa NON sono qui: arrivano dagli helper
# condivisi di centro_notifiche_alexa.yaml (vedi sopra). Qui resta solo la
# frequenza del promemoria, che è specifica di questa card.
input_number:
  frequenza_notifiche_raccolta_differenziata:
    name: Frequenza notifiche raccolta differenziata
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-sync
    initial: 15

############
# DATETIME #
############
input_datetime:
  raccolta_differenziata_notifiche_start_time:
    name: Inizio notifiche raccolta differenziata
    has_time: true
    has_date: false
    icon: mdi:timer-music
    initial: "06:00:00"

  raccolta_differenziata_notifiche_end_time:
    name: Fine notifiche raccolta differenziata
    has_time: true
    has_date: false
    icon: mdi:timer-off
    initial: "23:00:00"

##########
# SELECT #
##########
input_select:
  # I giorni sono volutamente "sfasati" di uno: raccolta_differenziata_lun
  # indica il rifiuto ritirato MARTEDÌ (il giorno dopo), perché la card lo
  # usa per dire "stanotte esci il bidone per il ritiro di domani".
  raccolta_differenziata_lun:
    name: Rifiuto raccolto Martedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_mar:
    name: Rifiuto raccolto Mercoledì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_mer:
    name: Rifiuto raccolto Giovedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_gio:
    name: Rifiuto raccolto Venerdì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_ven:
    name: Rifiuto raccolto Sabato
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_sab:
    name: Rifiuto raccolto Domenica
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]
  raccolta_differenziata_dom:
    name: Rifiuto raccolto Lunedì
    icon: mdi:delete-empty
    options: [*rifiuto1, *rifiuto2, *rifiuto3, *rifiuto4, *rifiuto5, *rifiuto6, *rifiuto7]

################################
# TEMPLATE SENSORI             #
################################
template:
  - sensor:
      # 1) Giorno della settimana -> sensor.giorno_della_settimana (es. "lun")
      - name: Giorno della settimana
        state: >
          {{ ['lun','mar','mer','gio','ven','sab','dom'][now().weekday()] }}
        icon: >
          mdi:{{ ['emoticon-dead-outline','emoticon-angry-outline','emoticon-sad-outline','emoticon-neutral-outline','emoticon-cool-outline','emoticon-excited-outline','emoticon-happy-outline'][now().weekday()] }}

      # 2) RaccoltaDifferenziata -> sensor.raccoltadifferenziata (il rifiuto di OGGI, usato dalla card)
      - name: RaccoltaDifferenziata
        state: >-
          {{ states("input_select.raccolta_differenziata_" + states('sensor.giorno_della_settimana'))[2:] }}

      # 3) GiornoSettimana -> sensor.giornosettimana (es. "Lunedì", usato dalla card)
      - name: GiornoSettimana
        state: >-
          {% set gg = now().weekday() %}
          {% set nomi = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'] %}
          {{ nomi[gg] }}

      # 4) GiornoRitiro -> sensor.giornoritiro (il giorno di DOMANI, usato dalla card)
      - name: GiornoRitiro
        state: >-
          {% set gg = now().weekday() %}
          {% set nomi = ['Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica','Lunedì'] %}
          {{ nomi[gg] }}

####################
# NOTIFICHE GRUPPO #
####################
notify:
  - name: Raccolta Differenziata Gruppo Notifiche App
    platform: group
    services:
      - service: *push1
      - service: *push2

###############
# AUTOMAZIONI #
###############
automation:
  # Attiva il flag "da notificare" all'orario di inizio finestra
  - alias: Attiva da notificare raccolta differenziata
    id: attiva_da_notificare_raccolta_differenziata
    mode: single
    trigger:
      - platform: time
        at: "04:59:00"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.raccolta_differenziata_da_notificare

  # Disattiva il flag all'orario di fine finestra
  - alias: Disattiva da notificare raccolta differenziata
    id: disattiva_da_notificare_raccolta_differenziata
    mode: single
    trigger:
      - platform: time
        at: input_datetime.raccolta_differenziata_notifiche_end_time
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.raccolta_differenziata_da_notificare

  # Promemoria ricorrente (push + vocale) mentre il flag è attivo, nella
  # finestra oraria, e solo se oggi c'è davvero qualcosa da buttare.
  # Un solo canale push (gruppo -> i tuoi telefoni) + un solo annuncio
  # vocale: niente doppio invio per lo stesso promemoria.
  - alias: Ricorda raccolta differenziata
    id: ricorda_raccolta_differenziata
    mode: single

    trigger:
      - platform: template
        value_template: >
          {{ (now().minute % (states('input_number.frequenza_notifiche_raccolta_differenziata') | int(15))) == 0 }}

    condition:
      - condition: state
        entity_id: input_boolean.raccolta_differenziata_da_notificare
        state: "on"
      - condition: time
        after: input_datetime.raccolta_differenziata_notifiche_start_time
        before: input_datetime.raccolta_differenziata_notifiche_end_time
      - condition: template
        value_template: >
          {{ states('input_select.raccolta_differenziata_' + states('sensor.giorno_della_settimana'))[2:] != 'Nulla' }}

    action:
      - service: notify.raccolta_differenziata_gruppo_notifiche_app
        continue_on_error: true
        data:
          title: "🚮 Ricordati di buttare l'immondizia"
          message: >-
            {{ states("input_select.raccolta_differenziata_" + states('sensor.giorno_della_settimana')) }}

      # Annuncio vocale su Alexa - usa il dispositivo/volumi/ritardo di
      # default dello script condiviso (packages/centro_notifiche_alexa.yaml).
      - service: script.notifica_vocale_alexa
        data:
          messaggio: >-
            Ricordati di buttare l'immondizia. Oggi si butta {{ states("input_select.raccolta_differenziata_" + states('sensor.giorno_della_settimana'))[2:] }}.

  # Annuncio vocale di TEST: crea da UI un helper booleano chiamato
  # input_boolean.test_notifica (Impostazioni > Dispositivi e servizi >
  # Helper > Interruttore) per poter provare l'annuncio a comando, senza
  # aspettare il ciclo automatico del promemoria.
  - alias: Test notifica vocale raccolta differenziata
    id: test_notifica_vocale_raccolta_differenziata
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.test_notifica
        to: "on"
    action:
      - service: script.notifica_vocale_alexa
        data:
          messaggio: >-
            Ricordati di buttare l'immondizia. Oggi si butta {{ states("input_select.raccolta_differenziata_" + states('sensor.giorno_della_settimana'))[2:] }}.
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.test_notifica
